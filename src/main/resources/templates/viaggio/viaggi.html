<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Viaggi')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 fw-bold mb-1">I Nostri Viaggi</h1>
                <p class="text-muted small mb-0">Trova il viaggio perfetto filtrando per destinazione, parola chiave o budget.</p>
            </div>
        </div>

        <div id="react-viaggi-root">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Caricamento catalogo in corso...</p>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" th:src="@{/js/react-viaggi.js}"></script>

</body>
</html>
