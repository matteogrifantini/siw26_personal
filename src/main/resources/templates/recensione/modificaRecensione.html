<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Modifica Recensione')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4 border-0">
                    <h1 class="h4 fw-bold mb-3">Modifica Recensione</h1>
                    <p class="text-muted small mb-3">
                        Stai modificando la tua recensione per: 
                        <strong th:text="${recensione.viaggio.titolo}">Titolo Viaggio</strong>
                    </p>

                    <form th:action="@{'/recensioni/modifica/' + ${recensione.id}}" method="post">
                        <div class="mb-3">
                            <label for="voto" class="form-label small fw-bold">Valutazione</label>
                            <select id="voto" name="voto" class="form-select form-select-sm">
                                <option value="5" th:selected="${recensione.voto == 5}">5 Stelle - Eccellente</option>
                                <option value="4" th:selected="${recensione.voto == 4}">4 Stelle - Molto Buono</option>
                                <option value="3" th:selected="${recensione.voto == 3}">3 Stelle - Nella Media</option>
                                <option value="2" th:selected="${recensione.voto == 2}">2 Stelle - Scarso</option>
                                <option value="1" th:selected="${recensione.voto == 1}">1 Stella - Pessimo</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="titolo" class="form-label small fw-bold">Titolo</label>
                            <input type="text" id="titolo" name="titolo" th:value="${recensione.titolo}" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-4">
                            <label for="commento" class="form-label small fw-bold">Commento</label>
                            <textarea id="commento" name="commento" th:text="${recensione.commento}" rows="3" class="form-control form-control-sm" required></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-sm btn-primary">Salva Modifiche</button>
                            <a th:href="@{'/viaggi/' + ${recensione.viaggio.id}}" class="btn btn-sm btn-outline-secondary">Annulla</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
