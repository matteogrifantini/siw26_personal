<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Le mie Prenotazioni')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-4">
        <h1 class="h3 fw-bold mb-3">Le mie Prenotazioni</h1>

        <div th:if="${prenotazioni.isEmpty()}" class="alert alert-secondary py-4 text-center">
            Non hai ancora effettuato alcuna prenotazione.
            <div class="mt-2">
                <a th:href="@{/viaggi}" class="btn btn-sm btn-primary">Esplora il catalogo viaggi</a>
            </div>
        </div>

        <div class="card shadow-sm border-0" th:unless="${prenotazioni.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Codice</th>
                            <th>Viaggio</th>
                            <th>Data Viaggio</th>
                            <th>Partecipanti</th>
                            <th>Totale</th>
                            <th>Stato</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${prenotazioni}">
                            <td><strong th:text="${p.codicePrenotazione}">TRV-XXXX</strong></td>
                            <td>
                                <a th:href="@{'/viaggi/' + ${p.viaggio.id}}" class="text-decoration-none fw-semibold" th:text="${p.viaggio.titolo}">Titolo</a>
                                <small class="text-muted d-block" th:text="${p.viaggio.destinazione.nome}">Destinazione</small>
                            </td>
                            <td>
                                <span th:text="${#temporals.format(p.viaggio.dataInizio, 'dd/MM/yyyy')}">Data</span>
                            </td>
                            <td th:text="${p.numeroPartecipanti} + ' persona/e'">2 persone</td>
                            <td class="fw-bold text-primary" th:text="${p.prezzoTotale} + ' €'">500 €</td>
                            <td>
                                <span class="badge" th:classappend="${p.stato.name() == 'CONFERMATA'} ? 'bg-success' : 'bg-danger'" th:text="${p.stato.etichetta}">Stato</span>
                            </td>
                            <td>
                                <form th:if="${p.stato.name() == 'CONFERMATA'}" th:action="@{'/prenotazioni/' + ${p.id} + '/annulla'}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Sei sicuro di voler annullare questa prenotazione? I posti verranno ripristinati.')">
                                        Annulla
                                    </button>
                                </form>
                                <span th:if="${p.stato.name() == 'CANCELLATA'}" class="text-muted small">Nessuna azione</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
