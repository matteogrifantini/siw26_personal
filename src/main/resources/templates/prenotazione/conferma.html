<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Conferma Prenotazione')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow p-4 text-center border-0">
                    <div class="text-success display-3 mb-2">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <h1 class="h3 fw-bold">Prenotazione Confermata!</h1>
                    <p class="text-muted">Grazie per aver scelto SiwTravel. Ecco il riepilogo del tuo ordine:</p>

                    <div class="card p-3 my-3 bg-light border text-start">
                        <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                            <span class="text-muted">Codice Prenotazione:</span>
                            <strong class="fs-5 text-primary" th:text="${prenotazione.codicePrenotazione}">TRV-XXXX</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Pacchetto Viaggio:</span>
                            <strong th:text="${prenotazione.viaggio.titolo}">Titolo Viaggio</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Destinazione:</span>
                            <span th:text="${prenotazione.viaggio.destinazione.nome + ' (' + prenotazione.viaggio.destinazione.paese + ')'}">Destinazione</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Date:</span>
                            <span th:text="${#temporals.format(prenotazione.viaggio.dataInizio, 'dd/MM/yyyy') + ' - ' + #temporals.format(prenotazione.viaggio.dataFine, 'dd/MM/yyyy')}">Date</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Numero Partecipanti:</span>
                            <span th:text="${prenotazione.numeroPartecipanti} + ' persona/e'">2</span>
                        </div>
                        <div class="d-flex justify-content-between border-top pt-2 mt-2">
                            <strong class="fs-5">Totale Pagato:</strong>
                            <strong class="fs-5 text-success" th:text="${prenotazione.prezzoTotale + ' €'}">500 €</strong>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-3 mt-3">
                        <a th:href="@{/prenotazioni/mie}" class="btn btn-primary">Le mie Prenotazioni</a>
                        <a th:href="@{/viaggi}" class="btn btn-outline-secondary">Continua lo Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
