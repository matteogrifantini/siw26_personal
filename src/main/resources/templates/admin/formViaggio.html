<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Gestione Viaggio')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 border-0">
                    <h1 class="h4 fw-bold mb-3" th:text="${viaggio.id == null ? 'Nuovo Pacchetto Viaggio' : 'Modifica Viaggio'}">Gestione Viaggio</h1>

                    <form th:action="@{/admin/viaggi/salva}" th:object="${viaggio}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="titolo" class="form-label small fw-bold">Titolo Viaggio</label>
                            <input type="text" id="titolo" th:field="*{titolo}" class="form-control form-control-sm"
                                   th:classappend="${#fields.hasErrors('titolo')} ? 'is-invalid' : ''" placeholder="es. Giappone: Sakura e Tradizione" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="destinazione" class="form-label small fw-bold">Destinazione</label>
                                <select id="destinazione" th:field="*{destinazione}" class="form-select form-select-sm" required>
                                    <option th:each="d : ${destinazioni}" th:value="${d.id}" th:text="${d.nome + ' (' + d.paese + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="prezzo" class="form-label small fw-bold">Prezzo a persona (€)</label>
                                <input type="number" step="0.01" id="prezzo" th:field="*{prezzo}" class="form-control form-control-sm" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="durataGiorni" class="form-label small fw-bold">Durata (giorni)</label>
                                <input type="number" id="durataGiorni" th:field="*{durataGiorni}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-4">
                                <label for="dataInizio" class="form-label small fw-bold">Data Partenza</label>
                                <input type="date" id="dataInizio" th:field="*{dataInizio}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-4">
                                <label for="dataFine" class="form-label small fw-bold">Data Ritorno</label>
                                <input type="date" id="dataFine" th:field="*{dataFine}" class="form-control form-control-sm" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="postiDisponibili" class="form-label small fw-bold">Posti Disponibili</label>
                                <input type="number" id="postiDisponibili" th:field="*{postiDisponibili}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-6">
                                <label for="immagineUrl" class="form-label small fw-bold">URL Immagine</label>
                                <input type="url" id="immagineUrl" th:field="*{immagineUrl}" class="form-control form-control-sm" placeholder="https://...">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold d-block">Categorie / Tag</label>
                            <div class="form-check form-check-inline" th:each="cat : ${categorie}">
                                <input class="form-check-input" type="checkbox" name="categoriaIds" th:value="${cat.id}" 
                                       th:id="${'cat_' + cat.id}" th:checked="${viaggio.categorie.contains(cat)}">
                                <label class="form-check-label small" th:for="${'cat_' + cat.id}" th:text="${cat.nome}"></label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="descrizione" class="form-label small fw-bold">Descrizione</label>
                            <textarea id="descrizione" th:field="*{descrizione}" class="form-control form-control-sm" rows="4"></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-sm btn-primary">Salva Pacchetto</button>
                            <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary">Annulla</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
