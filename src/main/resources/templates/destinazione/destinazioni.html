<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Destinazioni')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-4">
        <h1 class="h3 fw-bold mb-4">Tutte le Destinazioni</h1>

        <div class="row g-4">
            <div class="col-md-4" th:each="dest : ${destinazioni}">
                <div class="card h-100 shadow-sm">
                    <img th:src="${dest.immagineUrl != null and !#strings.isEmpty(dest.immagineUrl) ? dest.immagineUrl : 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600'}"
                         class="card-img-top" alt="Foto destinazione" style="height: 180px; object-fit: cover;"
                         onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600';">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h2 class="h5 card-title fw-bold text-dark mb-0" th:text="${dest.nome}">Nome</h2>
                            <span class="badge bg-secondary" th:text="${dest.continente}">Continente</span>
                        </div>
                        <p class="small text-muted mb-2">Paese: <strong th:text="${dest.paese}">Paese</strong></p>
                        <p class="card-text text-secondary small" th:text="${dest.descrizione}">Descrizione...</p>
                        <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                            <span class="small text-muted">
                                <span th:text="${dest.viaggi.size()}">0</span> pacchetti attivi
                            </span>
                            <a th:href="@{'/destinazioni/' + ${dest.id}}" class="btn btn-sm btn-outline-primary">Esplora Viaggi</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
